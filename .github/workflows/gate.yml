name: gate

# The semantic gate: does the patched engine still run NightMonkey's jit-tests?
#
# The test-source tree is the engine tree this workflow builds from the queue
# (tag + patches + data/ics, via scripts/build-engine.sh). It is linked in as
# NightMonkey's firefox/ path; the bare tag and the old fork are never used.
#
# The gate runs ONLY the two jit-test lanes. That is intentionally narrower
# than the slice A qualification, which also ran the local regressions, the
# guest-option checks and the baseline/MIR-stress tier regressions once.
#
# NightMonkey is built and driven as-is at the SHA in NIGHTMONKEY_PIN. A queue
# patch that changes opcodes or layout fails this gate by design: the
# NightMonkey change merges first, then a queue PR bumps NIGHTMONKEY_PIN.
#
# Two tiers (YurtOS/yurt-sandbox#367), picked by the `tier` job:
#   full: every jit-test in both lanes, split over SHARDS `jit-test shard N`
#     jobs that take the `build` job's shell and test sources. Nightly
#     (unless nothing changed, below), manual dispatch, a pull request labelled `ci:full` (or `gate`), and a
#     pull request that changes NIGHTMONKEY_PIN (a pin bump must show the
#     whole gate green before merge).
#   subset: the JIT_SUBSET path filters in both lanes, in the `build` job.
#     A pull request without the label that changes an engine input
#     (ENGINE_INPUTS: the queue, the pins, the build script, this file).
#   none: any other pull request (scripts, tests, docs); every job skips.
#     Also a nightly when no engine input changed since its base (the same
#     head, or a compare from the base's head that lists no ENGINE_INPUTS
#     path) and the base succeeded. Its summary links the base. The base is
#     the newest completed run on main that was a nightly or a
#     workflow_dispatch, so a green dispatch clears a carried red; pull
#     request runs and dispatches on other branches are not bases.
# A nightly with no engine input changed since a red base does not rebuild
# either: the tier job fails in seconds, linking the red run, so the red is
# carried forward (and is the next night's base) until an engine input
# changes or a dispatch on main runs the gate again. After a cancelled or
# skipped base, and on any doubt (no base among the last 20 completed runs on
# main, an API error, a compare that is not a fast-forward or may be
# truncated at 300 files), the nightly runs in full.
# The label and the changed files are read through the API when the run
# starts, not from the event: a push's event carries the labels of the
# moment it was sent, so a push a few seconds after labelling would take the
# lower tier and cancel the `labeled` run (yurt-playground#276). The files
# are the pull request's against its base, so a later docs-only push to a
# queue PR still runs the subset. Adding the label starts a run (the
# `labeled` type). An API error fails the run, never picks a tier.
#
# Any other label starts a run too (the event cannot filter on the label).
# That run gets a concurrency group of its own (its run id), so it does not
# cancel the gate in flight, and the tier job's `if:` skips it, which skips
# every job (they all need the tier). Its skipped checks can show as the
# latest for the head over an earlier red one; no check here is required, so
# nothing is bypassed, but read the run list, not only the checks summary.
#
# Needs a NightMonkey with `scripts/ci-suite.sh <suite> <lane> -- <args>`
# (YurtOS/nightmonkey#14) at NIGHTMONKEY_PIN, which also builds against an
# engine whose config names the ccache launcher.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A push or a `ci:full`/`gate` label replaces the PR's run in flight; a run
# started by any other label gets a group of its own (see the top). Nightly
# and dispatch runs on main share one group and queue rather than cancel.
concurrency:
  group: gate-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && github.event.label.name != 'gate' && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The pull request subset (jit_test.py path filters, substrings of the path
  # under js/src/jit-test/tests), chosen from the per-test times of
  # NightMonkey's full AOT lane (its run 40547142771): warp/ (Warp
  # specialisation: CacheIR-driven inlining, bailouts), baseline/ (the
  # baseline tier) and sunspider/ (whole programs). 339 files, about 560 s of
  # test time (2.5 min on the 4-core runner) against 11,100 s (46 min) for
  # all 8,571; every one passed in each green gate and NightMonkey run of
  # 2026-10-20..28.
  JIT_SUBSET: warp/ baseline/ sunspider/
  # jit_test.py --total-chunks: contiguous slices of the sorted list. Four
  # put 2,300-3,000 s of AOT test time (10-13 min) in each shard. Keep the
  # shard matrix below in step.
  SHARDS: 4
  # A pull request touching one of these (an extended regex over its file
  # paths) runs the subset.
  ENGINE_INPUTS: '^(patches/|data/|mozconfig$|UPSTREAM$|NIGHTMONKEY_PIN$|scripts/build-engine\.sh$|scripts/lib/|\.github/workflows/gate\.yml$)'

jobs:
  tier:
    # Not on a run started by an unrelated label (see the top).
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read only: the pull request's labels and changed files, and the
      # nightly's base run.
      pull-requests: read
      actions: read
    outputs:
      mode: ${{ steps.tier.outputs.mode }}
    steps:
      - name: Pick the tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mode=full
          skipped="no engine input changed); label the PR \`ci:full\` to run it"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # Any API error or doubt leaves mode=full (see the top).
            # The base: the newest completed nightly or dispatch on main.
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?branch=main&status=completed&per_page=20"
            base='[.workflow_runs[] | select(.head_branch == "main" and (.event == "schedule" or .event == "workflow_dispatch"))][0] // empty'
            last=$(gh api "$runs" --jq "$base"' | "\(.head_sha) \(.conclusion) \(.html_url)"') || last=
            read -r last_sha last_conclusion last_url <<< "$last" || true
            unchanged=false
            if [[ "${last_sha:-}" =~ ^[0-9a-f]{40}$ ]] && [[ "${last_conclusion:-}" =~ ^(success|failure)$ ]]; then
              if [ "$last_sha" = "$GITHUB_SHA" ]; then
                unchanged=true
              elif cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last_sha...$GITHUB_SHA" --jq '.status, (.files | length), .files[].filename'); then
                { read -r status; read -r count; changed=$(cat); } <<< "$cmp"
                if [ "$status" = ahead ] && [ "$count" -lt 300 ] && ! grep -qE "$ENGINE_INPUTS" <<< "$changed"; then
                  unchanged=true
                fi
              fi
            fi
            if [ "$unchanged" = true ] && [ "$last_conclusion" = failure ]; then
              msg="No engine input changed since the red run at ${last_sha:0:12} ($last_url): carrying it forward; dispatch the workflow to retry"
              echo "### Gate: red, carried forward. $msg" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Red nightly carried forward::$msg"
              exit 1
            elif [ "$unchanged" = true ]; then
              mode=none
              skipped="no engine input changed since the last green run at ${last_sha:0:12}: $last_url); dispatch the workflow to run it"
            fi
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            labels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
            if ! grep -qxE 'ci:full|gate' <<< "$labels"; then
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
              if grep -qx 'NIGHTMONKEY_PIN' <<< "$files"; then mode=full
              elif grep -qE "$ENGINE_INPUTS" <<< "$files"; then mode=subset
              else mode=none; fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          case $mode in
            full) echo "### Gate: all jit-tests, $SHARDS shards" ;;
            subset) echo "### Gate: jit-test subset (\`$JIT_SUBSET\`); label the PR \`ci:full\` for all of them" ;;
            none) echo "### Gate: skipped ($skipped" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: tier
    if: needs.tier.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    # Engine build (~8 min) + NightMonkey build (~2-9 min) + the subset.
    timeout-minutes: 90
    env:
      MODE: ${{ needs.tier.outputs.mode }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The logs dir is the uploaded artifact. Create it, with the pin, before
      # anything can fail, so an early failure is not masked by "no files found".
      - name: Prepare logs
        run: |
          mkdir -p "$RUNNER_TEMP/nightmonkey-logs"
          cp NIGHTMONKEY_PIN "$RUNNER_TEMP/nightmonkey-logs/NIGHTMONKEY_PIN"
          echo "NightMonkey pin: $(tr -d '[:space:]' < NIGHTMONKEY_PIN)" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential cmake ccache zstd

      - name: Read the pins
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit=//p' UPSTREAM)" >> "$GITHUB_OUTPUT"
          pin=$(tr -d '[:space:]' < NIGHTMONKEY_PIN)
          printf '%s\n' "$pin" | grep -Eq '^[0-9a-f]{40}$' ||
            { echo "NIGHTMONKEY_PIN must hold one full 40-hex SHA, got '$pin'" >&2; exit 1; }
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      # Restore only: engine.yml seeds this cache from main.
      - name: Restore ~/.mozbuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mozbuild
          key: mozbuild-ubuntu-24.04-${{ steps.pin.outputs.commit }}-${{ hashFiles('mozconfig', 'scripts/build-engine.sh', 'scripts/lib/patch-queue.sh', 'patches/*.patch') }}
          restore-keys: |
            mozbuild-ubuntu-24.04-${{ steps.pin.outputs.commit }}-

      # ccache for SpiderMonkey's C++. Saved below from main only (nightly or
      # a dispatch on main), one entry per run (the key is immutable); pull
      # requests restore the newest for the tag commit, else the newest of
      # any. Not in engine.yml: mach records the launcher in the dist's
      # js-build-config.json, and package-engine.sh would package it.
      - name: Restore the SpiderMonkey ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sm-ubuntu-24.04-${{ steps.pin.outputs.commit }}-${{ github.run_id }}
          restore-keys: |
            ccache-sm-ubuntu-24.04-${{ steps.pin.outputs.commit }}-
            ccache-sm-ubuntu-24.04-

      # mach reads CCACHE (the env form of --with-ccache); the mozconfig is
      # unchanged.
      - name: Configure ccache
        run: |
          {
            echo "CCACHE=ccache"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache -z

      - name: Build the engine from the queue
        run: scripts/build-engine.sh

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### SpiderMonkey ccache'
            echo '```'
            ccache -s
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Also after a failed build, but not after a cancellation or timeout.
      - name: Save the SpiderMonkey ccache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sm-ubuntu-24.04-${{ steps.pin.outputs.commit }}-${{ github.run_id }}

      # Tie the logs to what was tested: the engine's manifest (tag, commit,
      # queue tree, input and toolchain digests) next to the pin.
      - name: Record provenance
        run: |
          cp "$GITHUB_WORKSPACE/build-manifest.json" "$RUNNER_TEMP/nightmonkey-logs/build-manifest.json"
          {
            echo '```json'
            cat "$GITHUB_WORKSPACE/build-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out NightMonkey at NIGHTMONKEY_PIN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/nightmonkey
          ref: ${{ steps.pin.outputs.sha }}
          path: nightmonkey
          persist-credentials: false

      # NightMonkey's scripts/ci-suite.sh runs jit_test.py from $here/firefox.
      - name: Use the queue-built tree as NightMonkey's firefox/
        run: |
          test ! -e nightmonkey/firefox
          ln -s "$GITHUB_WORKSPACE/firefox" nightmonkey/firefox
          test -f nightmonkey/firefox/js/src/jit-test/jit_test.py

      - name: Install Rust from rust-toolchain.toml
        working-directory: nightmonkey
        run: |
          rustup show
          rustup target add wasm32-wasip1
          rustup component add rust-src

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: nightmonkey -> build/cargo
          key: gate-ubuntu-24.04
          # Nightly and dispatch runs on main seed it; gated PRs only read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Experiment (yurt-sandbox#367 section 2): sccache for the NightMonkey
      # cargo build, after rust-cache so RUSTC_WRAPPER stays out of its key.
      - name: Install sccache
        env:
          VERSION: 0.19.0
          # sha256 of sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz, as
          # published in the release's .sha256 file.
          SHA256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
        run: |
          set -euo pipefail
          if [ "$(uname -s)-$(uname -m)" != Linux-x86_64 ]; then
            echo "::error::this action ships only the x86_64 Linux sccache, not $(uname -s)-$(uname -m)"
            exit 1
          fi
          name="sccache-v${VERSION}-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/sccache"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/sccache.tar.gz" \
            "https://github.com/mozilla/sccache/releases/download/v${VERSION}/${name}.tar.gz"
          echo "${SHA256}  $dir/sccache.tar.gz" | sha256sum -c --strict -
          tar -xzf "$dir/sccache.tar.gz" -C "$dir" --strip-components=1 "${name}/sccache"
          rm "$dir/sccache.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"

      # sccache's GHA backend talks to the cache service directly, with the
      # runtime token that only JavaScript actions see. Hand it to later steps.
      - name: Expose the cache service to sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure sccache
        env:
          WRITE: true
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$WRITE" in
            true) mode=READ_WRITE ;;
            false) mode=READ_ONLY ;;
            auto)
              mode=READ_ONLY
              case "$GITHUB_EVENT_NAME" in
                push | schedule | workflow_dispatch)
                  if [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                    mode=READ_WRITE
                  fi ;;
              esac ;;
            *) echo "::error::write must be auto, true or false, got '$WRITE'"; exit 1 ;;
          esac
          # The server reads its config when it starts, so export before starting
          # it. No idle timeout: a server restarted mid-job would reset the stats.
          export SCCACHE_GHA_ENABLED=true SCCACHE_GHA_RW_MODE="$mode" SCCACHE_IDLE_TIMEOUT=0
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=$mode"
            echo "SCCACHE_IDLE_TIMEOUT=0"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sccache/sccache" --start-server
          echo "sccache $("$RUNNER_TEMP/sccache/sccache" --version | cut -d' ' -f2), GitHub cache $mode"

      - name: Build NightMonkey
        working-directory: nightmonkey
        run: |
          cmake -S . -B build -DSPIDERMONKEY_DIST="$GITHUB_WORKSPACE/firefox/obj-nightmonkey-sm/dist"
          cmake --build build
          test -x build/bin/inproc-shell.sh

      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      # ci-suite.sh pipes each lane through scripts/run-jit-tests.sh, which
      # applies scripts/check-test-log.py: a nonempty, passing run is required.
      - name: jit-tests (subset, both lanes)
        if: env.MODE == 'subset'
        working-directory: nightmonkey
        timeout-minutes: 125
        run: |
          read -ra paths <<< "$JIT_SUBSET"
          scripts/ci-suite.sh jit both -- "${paths[@]}"

      # The shards' inputs: the built shell (build/bin is self-contained:
      # inproc-shell.sh runs js-inproc under wasm-jit-runner, both next to it)
      # and the testsrc members package-test-sources.sh names (non262 whole,
      # for the shell.js files jit-tests load from it). A tar, because an
      # artifact does not keep the executable bit.
      - name: Package the shard inputs
        if: env.MODE == 'full'
        run: |
          tar -C nightmonkey -cf "$RUNNER_TEMP/shard-inputs.tar" build/bin
          tar -C firefox -rf "$RUNNER_TEMP/shard-inputs.tar" \
            js/src/jit-test js/src/tests/lib js/src/tests/non262 js/src/jsapi.h
          zstd -q -T0 --rm "$RUNNER_TEMP/shard-inputs.tar"
          ls -la "$RUNNER_TEMP/shard-inputs.tar.zst"

      - name: Upload the shard inputs
        if: env.MODE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name for every attempt: "Re-run failed jobs" reruns a failed
          # shard but not this job, so the shard must find this attempt's
          # upload; a rerun of this job replaces it.
          name: gate-shard-inputs
          path: ${{ runner.temp }}/shard-inputs.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7

  # The full jit-tests: each shard runs its slice in both lanes; together the
  # slices are the whole list (jit_test.py chunks the sorted list after the
  # excludes). One job per shard keeps each runner's time budget independent.
  jit-test:
    name: jit-test shard ${{ matrix.shard }}
    needs: [tier, build]
    if: needs.tier.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    # ci-suite.sh caps a lane at 60 min (timeout 3600s); a shard's AOT slice
    # is 10-13 min.
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare logs
        run: |
          mkdir -p "$RUNNER_TEMP/nightmonkey-logs"
          cp NIGHTMONKEY_PIN "$RUNNER_TEMP/nightmonkey-logs/NIGHTMONKEY_PIN"
          echo "NightMonkey pin: $(tr -d '[:space:]' < NIGHTMONKEY_PIN)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the shard pin
        id: pin
        run: |
          pin=$(tr -d '[:space:]' < NIGHTMONKEY_PIN)
          printf '%s\n' "$pin" | grep -Eq '^[0-9a-f]{40}$' ||
            { echo "NIGHTMONKEY_PIN must hold one full 40-hex SHA, got '$pin'" >&2; exit 1; }
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      - name: Check out NightMonkey at NIGHTMONKEY_PIN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/nightmonkey
          ref: ${{ steps.pin.outputs.sha }}
          path: nightmonkey
          persist-credentials: false

      - name: Download the shard inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-shard-inputs
          path: ${{ runner.temp }}/shard-inputs

      - name: Unpack the shard inputs
        run: |
          test ! -e nightmonkey/build
          mkdir -p "$RUNNER_TEMP/testsrc"
          zstd -dc "$RUNNER_TEMP/shard-inputs/shard-inputs.tar.zst" | tar -x -C "$RUNNER_TEMP/testsrc"
          mv "$RUNNER_TEMP/testsrc/build" nightmonkey/build
          test -x nightmonkey/build/bin/inproc-shell.sh
          test -f "$RUNNER_TEMP/testsrc/js/src/jit-test/jit_test.py"

      - name: jit-tests (shard ${{ matrix.shard }}, both lanes)
        working-directory: nightmonkey
        timeout-minutes: 125
        run: |
          if [ "$SHARD" -lt 1 ] || [ "$SHARD" -gt "$SHARDS" ]; then
            echo "shard $SHARD is outside 1..$SHARDS: keep the matrix and SHARDS in step" >&2
            exit 1
          fi
          NIGHT_FIREFOX_TESTS="$RUNNER_TEMP/testsrc" scripts/ci-suite.sh jit both -- --total-chunks="$SHARDS" --this-chunk="$SHARD"

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-jit-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7
