name: engine

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # release.yml builds through this job (one wasmtime pin, cache logic and
  # smoke test) with package: true; it then also packages the engine and the
  # test sources and uploads them as the engine-package artifact.
  workflow_call:
    inputs:
      package:
        description: Package the engine and the test sources after the smoke test
        type: boolean
        default: false
        required: false
      version:
        description: Firefox version of the package (UPSTREAM's), required with package
        type: string
        default: ''
        required: false
      revision:
        description: Package revision N (engine-v<version>-<N>), required with package
        type: string
        default: ''
        required: false
    outputs:
      package-artifact:
        description: Name of the artifact holding package-out/ (empty unless packaged)
        value: ${{ jobs.engine.outputs.package-artifact }}

permissions:
  contents: read

# In a called run, github.* is the caller's (release.yml: a tag push, or a
# dry-run workflow_dispatch that may be on main), so a release call gets its
# own group: it never shares, cancels or displaces a PR's or main's engine run.
# PR and main groups are unchanged (inputs is empty for them). Only PR runs
# cancel in progress; release.yml calls from tag pushes and dispatches only.
concurrency:
  group: engine-${{ inputs.package && 'release-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WASMTIME_VERSION: v50.0.0
  WASMTIME_SHA256: 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      package-artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential zstd

      - name: Install pinned wasmtime (verified before the build, to fail fast)
        run: |
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" "$url"
          echo "${WASMTIME_SHA256}  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime" --strip-components=1
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"

      - name: Read the pinned tag commit
        id: pin
        run: |
          commit=$(sed -n 's/^commit=//p' UPSTREAM)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # ~/.mozbuild (toolchains, sysroot) is the cache that pays off. The shallow
      # clone cache is deferred (controller ruling), and the objdir is not
      # cached: build-engine.sh always fetches into a fresh, empty workdir (the
      # objdir lives inside it, and a fresh checkout invalidates its
      # timestamps). Restore runs on every event; save runs only on main pushes
      # or manual dispatch (main seeds the cache for PRs), never for a release
      # call (package: true; its github.* is the caller's), and also after a
      # failed build so the expensive toolchain bootstrap is kept, but not after
      # a cancellation or timeout, which can leave a partial ~/.mozbuild that the
      # immutable key would then serve to every later run.
      - name: Restore ~/.mozbuild
        id: mozbuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mozbuild
          key: mozbuild-ubuntu-24.04-${{ steps.pin.outputs.commit }}-${{ hashFiles('mozconfig', 'scripts/build-engine.sh', 'scripts/lib/patch-queue.sh', 'patches/*.patch') }}
          restore-keys: |
            mozbuild-ubuntu-24.04-${{ steps.pin.outputs.commit }}-

      - name: Build the engine
        run: |
          start=$(date +%s)
          scripts/build-engine.sh
          echo "engine build took $(( ($(date +%s) - start) / 60 )) minutes" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save ~/.mozbuild
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && !inputs.package && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        with:
          path: ~/.mozbuild
          key: mozbuild-ubuntu-24.04-${{ steps.pin.outputs.commit }}-${{ hashFiles('mozconfig', 'scripts/build-engine.sh', 'scripts/lib/patch-queue.sh', 'patches/*.patch') }}

      - name: Smoke
        working-directory: firefox/obj-nightmonkey-sm
        run: |
          set -euo pipefail
          wasmtime --version
          out=$(wasmtime run --dir=. dist/bin/js -e 'print(6*7)')
          [ "$out" = 42 ] || { echo "smoke: expected 42, got '$out'" >&2; exit 1; }
          echo "smoke ok: $out"
          printf 'function f(n) { return n * 7; }\nprint(f(6));\n' > smoke.js
          out=$(wasmtime run --dir=. dist/bin/js smoke.js)
          [ "$out" = 42 ] || { echo "smoke: script expected 42, got '$out'" >&2; exit 1; }
          echo "smoke ok: $out"

      # Release builds only. The engine package (scripts/package-engine.sh)
      # records the test-source bundles' digests, so the bundles come first.
      # The tree is build-engine.sh's workdir (firefox/, with its objdir) and
      # the manifest is its build-manifest.json; both packagers re-check what
      # they take (UPSTREAM tree, clean index, contract).
      - name: Package the engine and test sources
        id: package
        if: ${{ inputs.package == true }}
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.revision }}
        run: |
          if [ -z "$PACKAGE_VERSION" ] || [ -z "$PACKAGE_REVISION" ]; then
            echo "package: the version and revision inputs are required" >&2
            exit 1
          fi
          scripts/package-test-sources.sh --tree firefox --out package-out --version "$PACKAGE_VERSION" --revision "$PACKAGE_REVISION" --jstests
          scripts/package-engine.sh --dist firefox/obj-nightmonkey-sm/dist --manifest build-manifest.json --out package-out --version "$PACKAGE_VERSION" --revision "$PACKAGE_REVISION" --test-sources package-out
          echo "artifact=engine-package" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        if: ${{ inputs.package == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-package
          path: package-out/
          if-no-files-found: error

      # Also after a failed step (a failed packaging leaves the manifest for
      # diagnosis), but not after a cancellation, and only once build-engine.sh
      # has written it.
      - name: Upload build manifest
        if: ${{ !cancelled() && hashFiles('build-manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-manifest
          path: build-manifest.json
          if-no-files-found: error
