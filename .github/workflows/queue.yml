name: queue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        # Warnings and errors only. The existing library has known SC1007 and
        # SC1091 findings (and the SC2120 optional-argument helper in the
        # check-queue test); those are excluded here rather than fixed.
        run: shellcheck -S warning -e SC1007,SC1091,SC2120 scripts/*.sh scripts/lib/*.sh tests/*.sh

      - name: Fixture suites
        run: scripts/check-queue.sh --fixtures

      - name: Fresh fetch, apply the queue, compare the tree hash
        run: scripts/check-queue.sh

      - name: Check out NightMonkey at NIGHTMONKEY_PIN
        id: pin
        run: |
          pin=$(tr -d '[:space:]' < NIGHTMONKEY_PIN)
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      - name: Check out NightMonkey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/nightmonkey
          ref: ${{ steps.pin.outputs.sha }}
          path: nightmonkey
          persist-credentials: false

      - name: mozconfig drift against NightMonkey
        env:
          NM_REPO: ${{ github.workspace }}/nightmonkey
        run: scripts/check-mozconfig-drift.sh
